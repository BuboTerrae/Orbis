[package]
name = "orbis-plugin-sdk"
version = "0.1.0"
edition = "2021"

[lib]
name = "orbis_plugin_sdk"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
libloading = "0.8"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }