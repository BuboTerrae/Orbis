[package]
name = "orbis-eval"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "orbis-eval"
path = "src/main.rs"

[dependencies]
orbis = { path = ".." }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tempfile = "3.8"